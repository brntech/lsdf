# Monitor executable policy for LLM Sensitive Data Firewall.

version: 0.2
name: monitor

detection:
  adapters: []
  entities:
    - SECRET
    - STRONG_ID
    - INTERNAL_ID
    - CREDIT_CARD
    - BANK_ACCOUNT
    - IBAN
    - SWIFT
    - EMAIL
    - PHONE
    - PERSON
    - DATE_OF_BIRTH
    - ADDRESS
    - PHI
    - EMPLOYEE_COMPENSATION
    - CUSTOMER_CONFIDENTIAL

action:
  mode: monitor
  rules:
    - id: monitor-secrets-everywhere
      match:
        entity_in_category: SECRET
        surface: any
      action: block
      severity: critical
      priority: 100

    - id: monitor-hard-identifiers-dispatch-surfaces
      match:
        entity_any_of: [CREDIT_CARD, BANK_ACCOUNT, IBAN, SWIFT]
        entity_in_category_any_of: [PHI, STRONG_ID, INTERNAL_ID]
        surface_any_of: [output.tool_calls.arguments, output.reasoning, logs.traces]
      action: block
      severity: critical
      priority: 90

    - id: monitor-hard-identifiers-content
      match:
        entity_any_of: [CREDIT_CARD, BANK_ACCOUNT, IBAN, SWIFT]
        entity_in_category_any_of: [PHI, STRONG_ID, INTERNAL_ID]
        surface_any_of: [input.messages, input.rag_context, input.tool_results, output.content, output.stream_chunk]
      action: redact
      severity: high
      priority: 70

    - id: monitor-generic-identity-outbound
      match:
        entity_any_of: [EMAIL, PHONE, PERSON]
        surface_any_of: [output.content, output.stream_chunk, output.tool_calls.arguments, output.reasoning, logs.traces]
      action: redact
      severity: medium
      priority: 60

audit:
  store_raw_values: false
  store_redacted_evidence: true
  include_policy_decision: true
