# Strict executable policy for LLM Sensitive Data Firewall.

version: 0.2
name: strict

detection:
  adapters: [prompt-injection]
  entities:
    - SECRET
    - STRONG_ID
    - INTERNAL_ID
    - CREDIT_CARD
    - BANK_ACCOUNT
    - IBAN
    - SWIFT
    - EMAIL
    - PHONE
    - PERSON
    - DATE_OF_BIRTH
    - ADDRESS
    - PHI
    - EMPLOYEE_COMPENSATION
    - CUSTOMER_CONFIDENTIAL
    - PROMPT_INJECTION

action:
  mode: redact
  rules:
    - id: block-secrets-everywhere
      match:
        entity_in_category: SECRET
        surface: any
      action: block
      severity: critical
      priority: 100

    - id: tokenize-hard-identifiers-before-model
      match:
        entity_any_of: [CREDIT_CARD, BANK_ACCOUNT, IBAN, SWIFT]
        entity_in_category_any_of: [PHI, STRONG_ID, INTERNAL_ID]
        surface_any_of: [input.messages, input.rag_context, input.tool_results]
      action: tokenize
      severity: high
      priority: 60

    - id: block-hard-identifiers-dispatch-surfaces
      match:
        entity_any_of: [CREDIT_CARD, BANK_ACCOUNT, IBAN, SWIFT]
        entity_in_category_any_of: [PHI, STRONG_ID, INTERNAL_ID]
        surface_any_of: [output.tool_calls.arguments, output.reasoning, logs.traces]
      action: block
      severity: critical
      priority: 90

    - id: redact-hard-identifiers-final-content
      match:
        entity_any_of: [CREDIT_CARD, BANK_ACCOUNT, IBAN, SWIFT]
        entity_in_category_any_of: [PHI, STRONG_ID, INTERNAL_ID]
        surface_any_of: [output.content, output.stream_chunk]
      action: redact
      severity: high
      priority: 70

    - id: redact-generic-identity-outbound
      match:
        entity_any_of: [EMAIL, PHONE, PERSON]
        surface_any_of: [output.content, output.stream_chunk, output.tool_calls.arguments, output.reasoning, logs.traces]
      action: redact
      severity: medium
      priority: 60

    - id: block-prompt-injection-retrieved-surfaces
      match:
        entity: PROMPT_INJECTION
        surface_any_of: [input.rag_context, input.tool_results]
      action: block
      severity: critical
      priority: 95

    - id: log-prompt-injection-user-messages
      match:
        entity: PROMPT_INJECTION
        surface: input.messages
      action: redact
      on_fail: observe
      severity: medium
      priority: 50

audit:
  store_raw_values: false
  store_redacted_evidence: true
  include_policy_decision: true
