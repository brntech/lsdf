name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the tagged source before publishing
        run: docker compose run --build --rm test
      - name: Check the tagged runtime image
        run: docker compose --profile runtime-smoke run --build --rm runtime-check
      - name: Exercise the tagged runtime gateway
        run: docker compose --profile runtime-smoke up --build --abort-on-container-exit --exit-code-from runtime-smoke-runner runtime-smoke-runner
      - name: Tear down runtime demo
        if: always()
        run: docker compose --profile runtime-smoke down
      - name: Check optional runtime startup without downloading detector weights
        run: docker compose --profile optional-runtime-smoke run --build --rm optional-runtime-check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/brntech/lsdf:${{ github.ref_name }}
            ghcr.io/brntech/lsdf:latest
      - name: Build and push optional runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-optional
          push: true
          tags: |
            ghcr.io/brntech/lsdf:${{ github.ref_name }}-optional
            ghcr.io/brntech/lsdf:latest-optional
