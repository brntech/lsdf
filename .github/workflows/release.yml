name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select validated version and stable image tags
        id: tags
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker compose build python
          docker compose run --rm python scripts/release_image_tags.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Test the tagged source before publishing
        run: docker compose run --build --rm test
      - name: Check the tagged runtime image
        run: docker compose --profile runtime-smoke run --build --rm runtime-check
      - name: Exercise the tagged runtime gateway
        run: docker compose --profile runtime-smoke up --build --abort-on-container-exit --exit-code-from runtime-smoke-runner runtime-smoke-runner
      - name: Tear down runtime demo
        if: always()
        run: docker compose --profile runtime-smoke down
      - name: Check optional runtime startup without downloading detector weights
        run: docker compose --profile optional-runtime-smoke run --build --rm optional-runtime-check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push optional runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-optional
          platforms: linux/amd64
          push: true
          provenance: mode=min
          tags: ${{ steps.tags.outputs.optional }}
      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: mode=min
          tags: ${{ steps.tags.outputs.runtime }}
